spring.application.name=BrainStack
# DB Configuration :
spring.datasource.url=jdbc:mysql://localhost:3306/brainstack?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Web Server (Tomcat) configuration :
server.port=8089
server.servlet.context-path=/api/v1

# AI Microservice Configuration :
ai.microservice.url=http://localhost:5000
ai.microservice.timeout=5000
ai.microservice.retry-attempts=3